# 默认不激活任何 profile，即生产配置；本地开发设环境变量 SPRING_PROFILES_ACTIVE=dev（自动建表并加载演示数据）
spring:
  application:
    name: HotelSystemBackend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/HotelSystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hotel:
  scheduler:
    enabled: ${HOTEL_SCHEDULER_ENABLED:true}

aliyun:
  endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-chengdu.aliyuncs.com}
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_SECRET_KEY:}
  bucket-name: ${ALIYUN_BUCKET_NAME:hotelsystem}
