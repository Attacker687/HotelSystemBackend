# 默认不激活任何 profile，即生产配置；本地开发设环境变量 SPRING_PROFILES_ACTIVE=dev（自动建表并加载演示数据）
spring:
  application:
    name: HotelSystemBackend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/HotelSystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 上传超限时 Tomcat 要读掉未读完的请求体才能正常返回 413；默认只读 2MB，超过就直接断开连接，客户端收不到 413。
    # 取 multipart 默认的 max-request-size（10MB）
    max-swallow-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

hotel:
  agent:
    provider: ${HOTEL_AGENT_PROVIDER:openai}
    model: ${HOTEL_AGENT_MODEL:gpt-6-luna}
    openai:
      api-key: ${OPENAI_API_KEY:}
  scheduler:
    enabled: ${HOTEL_SCHEDULER_ENABLED:true}
  jwt:
    # 必填：至少 256 位的随机密钥，缺失时应用拒绝启动
    secret: ${JWT_SECRET:}
  cors:
    # 允许跨域的前端域名，逗号分隔；为空时不允许任何跨域来源
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  login:
    # 同一账号或同一 IP 在窗口期内登录失败达到上限后，限制一段时间
    max-failures: 5
    window-minutes: 15
    lock-minutes: 15

aliyun:
  endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-chengdu.aliyuncs.com}
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_SECRET_KEY:}
  bucket-name: ${ALIYUN_BUCKET_NAME:hotelsystem}
