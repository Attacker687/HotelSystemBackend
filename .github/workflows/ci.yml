# 每次开 PR / 往 PR 推代码、以及合入 master 时，在干净的 Linux 机器上跑全部测试。
# 单元测试（surefire）、集成测试（failsafe + Testcontainers）、浏览器测试（Playwright）都在 mvn verify 里。
# 只用假模型，不需要 OPENAI_API_KEY；真实模型评测要花钱，不放进 CI。
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn clean verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        run: mvn -B clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/failsafe-e2e-reports
            target/e2e
          if-no-files-found: ignore
          retention-days: 7
